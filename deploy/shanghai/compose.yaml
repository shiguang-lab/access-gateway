name: shiguang-access-gateway-prod

services:
  access-gateway:
    image: ${GATEWAY_IMAGE:?set an immutable image reference ending in @sha256:digest}
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GATEWAY_ADDR: 127.0.0.1:19480
      GATEWAY_HEALTHCHECK_URL: http://127.0.0.1:19480/health/ready
      AUTH_SERVICE_URL: http://127.0.0.1:19481
      AUTH_SERVICE_TOKEN_FILE: /run/secrets/auth_service_token
      SESSION_COOKIE_NAME: __Secure-sg_session
      ROUTES_FILE: /etc/access-gateway/routes.json
      TRUSTED_PROXY_CIDRS: 127.0.0.0/8,::1/128
    secrets:
      - auth_service_token
    volumes:
      - ./routes.json:/etc/access-gateway/routes.json:ro
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/access-gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  auth_service_token:
    file: ${GATEWAY_AUTH_TOKEN_FILE:?set the path to the Auth-issued gateway token file}
