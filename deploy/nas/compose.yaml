name: shiguang-gateway-go-candidate

services:
  access-gateway:
    image: ${GATEWAY_IMAGE:?Set a versioned access-gateway image}
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${GATEWAY_ENV_FILE:?Set GATEWAY_ENV_FILE}
    environment:
      GATEWAY_ADDR: :8080
      AUTH_SERVICE_URL: http://auth-service:8081
      AUTH_SERVICE_TOKEN: ${GATEWAY_SHARED_TOKEN:?Set GATEWAY_SHARED_TOKEN}
      SESSION_COOKIE_NAME: __Secure-sg_session
      ROUTES_FILE: /etc/access-gateway/routes.json
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12,100.64.0.0/10
    ports:
      - "100.87.115.78:${GATEWAY_PORT:-13600}:8080"
    volumes:
      - ./routes.json:/etc/access-gateway/routes.json:ro
    networks:
      - auth-edge
      - website
      - superagents
      - analytics
      - zitadel
      - opc-infra
    healthcheck:
      test: ["CMD", "/access-gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  auth-edge:
    external: true
    name: shiguang-auth-edge
  opc-infra:
    external: true
    name: opc-infra_default
  website:
    external: true
    name: shiguang-website_default
  superagents:
    external: true
    name: opc-web_default
  analytics:
    external: true
    name: umami_default
  zitadel:
    external: true
    name: zitadel
